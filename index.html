<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>غرفة متابعة الإعلانات</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#5a4e42">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أرض الأجداد">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
  body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f6f5fa;color:#1d1b33;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .box{text-align:center;padding:24px}
  .sp{width:34px;height:34px;border:3px solid #d9d6ea;border-top-color:#1d1b33;border-radius:50%;margin:0 auto 14px;animation:r 1s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  button{margin-top:12px;font:inherit;padding:8px 18px;border-radius:8px;border:1px solid #1d1b33;background:#1d1b33;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="box" id="box"><div class="sp"></div>جاري تحميل غرفة متابعة الإعلانات…</div>
<script>
/* الصفحة دي بتجيب شكل الداشبورد وأرقامه من سكريبت جوجل «غرفة متابعة الإعلانات» من غير ما تبعت حساب جوجل،
   فبتفتح عادي حتى لو المتصفح فيه أكتر من حساب جوجل. أي تعديل في الداشبورد على جوجل بيظهر هنا لوحده. */
var API = 'https://script.google.com/macros/s/AKfycbxIzKBDRqOccmGXvioilFoTTBNqFJxDvU0S6RaToQtH9yMShzADnJzXSNLJx3fECV7xwA/exec';
var SHIM = '<script>(function(){var API=' + JSON.stringify(API) + ';var MAP={getData:"data",pullSalla:"pull"};' +
  'function mk(ok,fail){return new Proxy({},{get:function(_,k){' +
  'if(k==="withSuccessHandler")return function(h){return mk(h,fail)};' +
  'if(k==="withFailureHandler")return function(h){return mk(ok,h)};' +
  'if(k==="withUserObject")return function(){return mk(ok,fail)};' +
  'return function(){fetch(API+"?api="+(MAP[k]||k)+"&t="+Date.now(),{credentials:"omit"}).then(function(r){return r.json()})' +
  '.then(function(d){if(d&&d.error&&fail)fail(new Error(d.error));else if(ok)ok(d)})' +
  '.catch(function(e){if(fail)fail(e)})}}})}' +
  'window.google={script:{run:mk(null,null)}};})();<\/script>';

/* نفس وسوم التطبيق لازم تتحط جوه الصفحة اللي بتتكتب، عشان الموبايل يشوف اللوجو وزرار التثبيت */
var APP_HEAD = '<meta name="theme-color" content="#5a4e42"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="favicon-64.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="أرض الأجداد"><meta name="apple-mobile-web-app-status-bar-style" content="default">';
if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }

function fail(){
  document.getElementById('box').innerHTML = 'ما قدرنا نحمّل الداشبورد. تأكد من الإنترنت وجرّب تاني.<br><button onclick="location.reload()">حاول تاني</button>';
}
fetch(API + '?api=html&t=' + Date.now(), {credentials: 'omit'})
  .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
  .then(function(html){
    if (html.indexOf('<html') < 0) throw new Error('bad');
    html = html.replace(/<base[^>]*>/i, '').replace(/<head[^>]*>/i, function(m){ return m + APP_HEAD + SHIM; });
    document.open(); document.write(html); document.close();
  })
  .catch(fail);
</script>
</body>
</html>
